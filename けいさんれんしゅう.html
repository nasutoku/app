<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なとくけいさんれんしゅう！</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght=700;800;900&family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sky:#e8f4fd;--blue:#378ADD;--darkblue:#185FA5;--green:#1D9E75;--darkgreen:#0F6E56;
  --red:#E24B4A;--amber:#EF9F27;--purple:#7F77DD;--coral:#D85A30;--pink:#D4537E;
  --card:#fff;--border:#c8dff5;--text:#1a2d45;--muted:#5a7a9a;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Kosugi Maru',sans-serif;background:var(--sky);}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#b5d4f460 1.5px,transparent 1.5px);background-size:32px 32px;pointer-events:none;z-index:0;}

.app-wrap{display:flex;height:100vh;position:relative;z-index:1;}

/* ===== LEFT PANEL ===== */
.left-panel{width:360px;min-width:320px;display:flex;flex-direction:column;padding:4px;gap:4px;overflow:hidden;height:100vh;}

/* タイトル */
.app-title{font-family:'Nunito',sans-serif;font-size:16px;font-weight:900;color:var(--darkblue);
  background:linear-gradient(135deg,#eaf4ff,#e8fff6);border-radius:12px;padding:4px 12px;
  border:2px solid var(--border);text-align:center;letter-spacing:1px;}

/* 設定カード */
.settings-card{background:var(--card);border-radius:12px;padding:6px 12px;border:2px solid var(--border);box-shadow:0 2px 6px #185FA510;}
.settings-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.setting-group{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:bold;}
.setting-group select{font-size:12px;padding:3px 6px;border-radius:7px;border:1.5px solid var(--border);background:#f0f8ff;color:var(--text);cursor:pointer;font-family:'Kosugi Maru',sans-serif;}

/* 詳細設定エリア */
.detail-settings{border-top:1px dashed var(--border);padding-top:6px;margin-top:8px;display:flex;flex-direction:column;gap:8px;}

/* グレーアウト時のスタイル設定 */
.setting-group.disabled-style {opacity: 0.55; pointer-events: none;}
.setting-group select:disabled {background: #f0f0f0; border-color: #ccc; color: #888; cursor: not-allowed;}

.op-label{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:bold;}
.op-row{display:flex;gap:5px;margin-bottom:10px;}
.op-btn{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;padding:2px 0;width:54px;border-radius:9px;
  border:2px solid var(--border);background:#f0f8ff;color:var(--muted);cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:4px;}
.op-btn:hover{border-color:var(--blue);color:var(--blue);}
.op-btn.active{background:var(--blue);border-color:var(--darkblue);color:#fff;box-shadow:0 2px 5px #378ADD50;}

/* スコアバー */
.score-area{display:none;}
.score-bar{display:flex;justify-content:space-between;align-items:center;}
.q-label{font-size:12px;color:var(--muted);}
.score-val{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;color:var(--darkblue);}
.progress-wrap{height:8px;background:#ddeeff;border-radius:99px;overflow:hidden;margin-top:4px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* 問題カード（初期状態・結果用） */
.question-card{display:none;background:linear-gradient(135deg,#eaf5ff,#f0faf5);
  border-radius:14px;padding:8px 14px;border:2px solid var(--border);text-align:center;
  box-shadow:0 3px 10px #185FA515;flex-direction:column;justify-content:center;}
.q-hint{font-size:11px;color:var(--muted);margin-bottom:4px;}
.question-text{font-family:'Nunito',sans-serif;font-size:30px;font-weight:900;color:var(--text);letter-spacing:1px;}
.question-text .op-sym{color:var(--coral);padding:0 5px;}
.question-text .eq darkness{color:var(--purple);padding:0 5px;}

/* 横並び（並列）用のコンテナ */
.qa-row-wrap {display:flex;align-items:center;gap:6px;width:100%;}
.qa-row-wrap .question-card {display:flex;flex:1.4;height:50px;padding:0 8px;border-radius:10px;box-shadow:none;background:#f4f9ff;align-items:center;justify-content:center;}
.qa-row-wrap .question-text {font-size:26px;}
.qa-row-wrap .eq-separator {font-family:'Nunito',sans-serif;font-size:24px;font-weight:900;color:var(--purple);display:flex;align-items:center;}

/* 解答エリア */
.answer-display{background:#fff;border:2.5px solid var(--border);border-radius:10px;
  padding:0 10px;height:50px;display:flex;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;flex:0.8;
  color:var(--darkblue);transition:border-color .2s;letter-spacing:1px;text-align:center;line-height:1;}
.answer-display.wrong{border-color:var(--red);animation:shake .35s;}
.answer-display.correct{border-color:var(--green);}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}

/* 数字パッド */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.num-btn{font-family:'Nunito',sans-serif;font-size:20px;font-weight:800;padding:7px 0;
  border-radius:9px;border:2px solid;cursor:pointer;transition:transform .1s,box-shadow .1s;user-select:none;box-shadow:0 3px 0;}
.num-btn:active{transform:translateY(3px);box-shadow:0 0 0!important;}
.n0{background:#E6F1FB;border-color:#B5D4F4;color:#0C447C;box-shadow:0 3px 0 #85B7EB;}
.n1{background:#EAF3DE;border-color:#C0DD97;color:#27500A;box-shadow:0 3px 0 #97C459;}
.n2{background:#FBEAF0;border-color:#F4C0D1;color:#72243E;box-shadow:0 3px 0 #ED93B1;}
.n3{background:#FAEEDA;border-color:#FAC775;color:#633806;box-shadow:0 3px 0 #EF9F27;}
.n4{background:#EEEDFE;border-color:#CECBF6;color:#3C3489;box-shadow:0 3px 0 #AFA9EC;}
.n5{background:#E1F5EE;border-color:#9FE1CB;color:#085041;box-shadow:0 3px 0 #5DCAA5;}
.n6{background:#FAECE7;border-color:#F5C4B3;color:#712B13;box-shadow:0 3px 0 #F0997B;}
.n7{background:#E6F1FB;border-color:#85B7EB;color:#0C447C;box-shadow:0 3px 0 #378ADD;}
.n8{background:#EAF3DE;border-color:#97C459;color:#27500A;box-shadow:0 3px 0 #639922;}
.n9{background:#FBEAF0;border-color:#ED93B1;color:#72243E;box-shadow:0 3px 0 #D4537E;}
.clear-btn{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;padding:7px;
  border-radius:9px;border:2px solid #F7C1C1;background:#FCEBEB;color:#A32D2D;cursor:pointer;
  box-shadow:0 3px 0 #F09595;transition:transform .1s,box-shadow .1s;}
.clear-btn:active{transform:translateY(3px);box-shadow:0 0 0!important;}
.answer-btn{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;padding:12px 8px;
  border-radius:9px;border:2px solid var(--darkgreen);background:var(--green);color:#fff;cursor:pointer;
  box-shadow:0 3px 0 var(--darkgreen);transition:transform .1s,box-shadow .1s;}
.answer-btn:active{transform:translateY(3px);box-shadow:0 0 0!important;}
.start-btn{font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;padding:12px 32px;
  border-radius:12px;border:none;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;
  cursor:pointer;box-shadow:0 4px 0 var(--darkblue);transition:transform .1s,box-shadow .1s;display:block;margin:0 auto;}
.start-btn:active{transform:translateY(4px);box-shadow:0 0 0!important;}

.intro-area{text-align:center;padding:0px 0 10px;margin-top:-20px;}
.intro-area p{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.8;}

/* 結果 */
.result-card{background:var(--card);border-radius:16px;padding:16px;border:2px solid var(--border);text-align:center;box-shadow:0 3px 12px #185FA515;}
.result-score{font-family:'Nunito',sans-serif;font-size:60px;font-weight:900;color:var(--darkblue);line-height:1;}
.result-sub{font-size:13px;color:var(--muted);margin-bottom:3px;}
.result-msg{font-size:15px;margin:8px 0 12px;color:var(--text);}
.result-list{text-align:left;font-size:13px;background:#f5f9ff;border-radius:10px;padding:8px 12px;margin-bottom:12px;max-height:150px;overflow-y:auto;}
.result-list .row{display:flex;gap:6px;padding:2px 0;border-bottom:1px solid #e0edff;align-items:center;}
.result-list .row:last-child{border-bottom:none;}
.badge-ok{color:var(--green);font-weight:700;}
.badge-ng{color:var(--red);font-weight:700;}

/* ===== RIGHT PANEL ===== */
.right-panel{flex:1;background:#fffef5;border-left:2.5px dashed #b0d0e8;display:flex;flex-direction:column;overflow:hidden;}
.hissan-header{background:linear-gradient(135deg,#fffbe6,#fff9d0);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px dashed #d0c060;}
.hissan-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#8a6a00;display:flex;align-items:center;gap:5px;}
.hissan-btn{font-size:12px;font-family:'Kosugi Maru',sans-serif;padding:3px 10px;border-radius:7px;border:1.5px solid #c8b040;background:#fff9d0;color:#8a6a00;cursor:pointer;}
.hissan-btn:hover{background:#f5e84a;}
.canvas-wrap{flex:1;overflow:hidden;position:relative;}
#hissanCanvas{width:100%;height:100%;cursor:crosshair;touch-action:none;display:block;}
.pen-toolbar{background:#fffbe6;border-top:1.5px dashed #d0c060;padding:6px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pen-label{font-size:11px;color:#8a6a00;}
.color-pick{width:22px;height:22px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform .15s;}
.color-pick.sel{border-color:#185FA5;transform:scale(1.25);}
.size-btn{font-size:11px;padding:2px 8px;border-radius:7px;border:1.5px solid #c8b040;background:#fff9d0;color:#8a6a00;cursor:pointer;}
.size-btn.sel{background:#f5e84a;}
.eraser-btn{font-size:11px;padding:3px 10px;border-radius:7px;border:1.5px solid #c8b040;background:#fff9d0;color:#8a6a00;cursor:pointer;}
.eraser-btn.sel{background:#fcd9a0;border-color:#d08020;}

/* CONFETTI & PRAISE */
#confettiWrap{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;}
.praise-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:201;}
.praise-text{font-family:'Nunito',sans-serif;font-size:60px;font-weight:900;
  opacity:0;transform:scale(.4) rotate(-8deg);transition:all .35s cubic-bezier(.3,1.5,.5,1);
  text-shadow:0 4px 16px rgba(0,0,0,.15);}
.praise-text.show{opacity:1;transform:scale(1) rotate(0deg);}
.praise-text.hide{opacity:0;transform:scale(1.5) translateY(-60px);}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="app-wrap">

  <div class="left-panel">

    <div class="app-title">🔢 なとくけいさんれんしゅう！</div>

    <div class="settings-card">
      <div class="op-label">けいさんの種類（1つえらぼう）：</div>
      <div class="op-row" id="opRow">
        <button class="op-btn active" data-op="+">＋</button>
        <button class="op-btn" data-op="-">－</button>
        <button class="op-btn" data-op="×">×</button>
        <button class="op-btn" data-op="÷">÷</button>
      </div>

      <div class="settings-row">
        <div class="setting-group">
          <select id="dig1">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
          <label>けた と</label>
        </div>
        <div class="setting-group">
          <select id="dig2">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
          <label>けた の けいさん</label>
        </div>
      </div>

      <div class="detail-settings">
        <div class="setting-group" id="kuriSettingGroup">
          <label for="kuris">くり上がり・くり下がり：</label>
          <select id="kuris">
            <option value="any" selected>気にしない</option>
            <option value="no">なし</option>
            <option value="yes">あり</option>
          </select>
        </div>
      </div>
    </div>

    <div class="score-area" id="scoreArea">
      <div class="score-bar">
        <span class="q-label" id="qLabel">もんだい 1 / 10</span>
        <span class="score-val" id="scoreVal">0点</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    </div>

    <div id="mainArea" style="flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden;">
      <div class="intro-area">
        <p>けいさんの種類をえらんで<br>スタートをおそう！<br>右のスペースでひっ算もできるよ ✏️</p>
        <button class="start-btn" onclick="startGame()">▶ スタート！</button>
      </div>
    </div>

  </div>

  <div class="right-panel">
    <div class="hissan-header">
      <div class="hissan-title">✏️ ひっ算スペース</div>
      <button class="hissan-btn" onclick="clearCanvas()">🗑 けす</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="hissanCanvas"></canvas>
    </div>
    <div class="pen-toolbar">
      <span class="pen-label">いろ：</span>
      <div class="color-pick sel" style="background:#1a2d45;" data-color="#1a2d45" onclick="setColor(this)"></div>
      <div class="color-pick" style="background:#E24B4A;" data-color="#E24B4A" onclick="setColor(this)"></div>
      <div class="color-pick" style="background:#378ADD;" data-color="#378ADD" onclick="setColor(this)"></div>
      <div class="color-pick" style="background:#1D9E75;" data-color="#1D9E75" onclick="setColor(this)"></div>
      <div class="color-pick" style="background:#EF9F27;" data-color="#EF9F27" onclick="setColor(this)"></div>
      <span class="pen-label" style="margin-left:4px;">ふとさ：</span>
      <button class="size-btn sel" data-size="3" onclick="setSize(this)">細</button>
      <button class="size-btn" data-size="6" onclick="setSize(this)">中</button>
      <button class="size-btn" data-size="12" onclick="setSize(this)">太</button>
      <button class="eraser-btn" id="eraserBtn" onclick="toggleEraser()">消しゴム</button>
    </div>
  </div>
</div>

<div id="confettiWrap"></div>
<div class="praise-overlay"><div class="praise-text" id="praiseText"></div></div>

<script>
// ====== AUDIO ======
const AC = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq,type,dur,vol=0.3,delay=0){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime+delay);
  g.gain.setValueAtTime(0,AC.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+delay+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+delay+dur);
  o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur+0.01);
}
function playClick(){playTone(800,'square',0.06,0.12);}
function playCorrect(){
  [523,659,784,1047].forEach((f,i)=>playTone(f,'sine',0.25,0.22,i*0.1));
  playTone(2093,'sine',0.3,0.06,0.15);playTone(2637,'sine',0.2,0.05,0.25);
}
function playWrong(){playTone(200,'sawtooth',0.15,0.18);playTone(150,'sawtooth',0.2,0.15,0.12);}
function playStart(){[523,587,659,784].forEach((f,i)=>playTone(f,'sine',0.18,0.2,i*0.08));}
function playFinish(s){
  if(s>=100){[523,659,784,1047,784,1047,1319].forEach((f,i)=>playTone(f,'sine',0.3,0.25,i*0.09));}
  else if(s>=60){[523,659,784].forEach((f,i)=>playTone(f,'sine',0.3,0.22,i*0.1));}
  else{playTone(330,'sine',0.4,0.18);playTone(294,'sine',0.4,0.18,0.2);}
}
function playClear(){playTone(400,'sine',0.08,0.12);}
function resumeAC(){if(AC.state==='suspended')AC.resume();}
document.addEventListener('click',resumeAC,{once:true});

// ====== GAME ======
let qNum=0,score=0,answer='',selectedOp='+',currentQ=null,gameActive=false,history=[];
const praises=['すごい！🌟','やったね！🎉','かんぺき！✨','さいこう！🏆','ばっちり！🌈',
  'よくできました！⭐','すばらしい！💫','天才！🎊','パーフェクト！💥','おみごと！🎯'];

// 演算子に応じて詳細設定の有効・無効を切り替える関数
function updateDetailSettingsState() {
  const kurisSelect = document.getElementById('kuris');
  const group = document.getElementById('kuriSettingGroup');
  
  if (selectedOp === '÷') {
    kurisSelect.value = 'any'; // 割り算の場合は強制的に「気にしない」にする
    kurisSelect.disabled = true;
    group.classList.add('disabled-style');
  } else {
    kurisSelect.disabled = false;
    group.classList.remove('disabled-style');
  }
}

// 計算の種類ボタンが押されたとき
document.getElementById('opRow').querySelectorAll('.op-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.op-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    selectedOp=b.dataset.op;
    playClick();
    
    // 割り算判定のUI更新
    updateDetailSettingsState();
    
    if (gameActive) {
      qNum--; 
      nextQuestion();
    }
  });
});

// けた・くり上がりの設定が変更されたとき
['dig1', 'dig2', 'kuris'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (gameActive) {
      qNum--; 
      nextQuestion();
    }
  });
});

function getRand(digits){
  return Math.floor(Math.random()*(Math.pow(10,digits)-Math.pow(10,digits-1)))+Math.pow(10,digits-1);
}

// くり上がり・くり下がり判定関数
function checkKuri(a, b, op) {
  if (op === '+') {
    let strA = String(a).split('').reverse();
    let strB = String(b).split('').reverse();
    const len = Math.max(strA.length, strB.length);
    for (let i = 0; i < len; i++) {
      let nA = parseInt(strA[i] || 0);
      let nB = parseInt(strB[i] || 0);
      if (nA + nB >= 10) return true;
    }
    return false;
  }
  if (op === '-') {
    let strA = String(a).split('').reverse();
    let strB = String(b).split('').reverse();
    const len = Math.max(strA.length, strB.length);
    for (let i = 0; i < len; i++) {
      let nA = parseInt(strA[i] || 0);
      let nB = parseInt(strB[i] || 0);
      if (nA < nB) return true;
    }
    return false;
  }
  if (op === '×') {
    let strA = String(a).split('').reverse().map(Number);
    let strB = String(b).split('').reverse().map(Number);

    for (let j = 0; j < strB.length; j++) {
      let carry = 0;
      let partialCarryDetected = false;
      
      for (let i = 0; i < strA.length; i++) {
        let prod = strA[i] * strB[j] + carry;
        carry = Math.floor(prod / 10);
        
        if (prod >= 10 && i < strA.length - 1) {
          partialCarryDetected = true;
        }
        if (prod >= 10 && i === strA.length - 1) {
          partialCarryDetected = true;
        }
      }
      if (partialCarryDetected) return true;
    }

    if (strB.length > 1) {
      let lines = [];
      for (let j = 0; j < strB.length; j++) {
        lines.push(a * strB[j] * Math.pow(10, j));
      }
      let sum = lines[0];
      for (let k = 1; k < lines.length; k++) {
        if (checkKuri(sum, lines[k], '+')) return true;
        sum += lines[k];
      }
    }
    return false;
  }
  return false;
}

function genQ(){
  const d1=parseInt(document.getElementById('dig1').value);
  const d2=parseInt(document.getElementById('dig2').value);
  const kuriSetting=document.getElementById('kuris').value;
  const op=selectedOp;

  let a, b, ans, valid;
  let attempts = 0;

  do {
    attempts++;
    valid = true;
    a = getRand(d1);
    b = getRand(d2);

    if(op==='+'){
      ans=a+b;
    } else if(op==='-'){
      if(a<b)[a,b]=[b,a];
      ans=a-b;
    } else if(op==='×'){
      ans=a*b;
    } else {
      b=b===0?1:b;
      const aMin=Math.pow(10,d1-1), aMax=Math.pow(10,d1)-1;
      const qMin=Math.ceil(aMin/b), qMax=Math.floor(aMax/b);
      const q=qMin>qMax?1:Math.floor(Math.random()*(qMax-qMin+1))+qMin;
      a=b*q;
      ans=q;
    }

    if (valid && (op === '+' || op === '-' || op === '×')) {
      const hasKuri = checkKuri(a, b, op);
      if (kuriSetting === 'no' && hasKuri) valid = false;
      if (kuriSetting === 'yes' && !hasKuri) valid = false;
    }

  } while (!valid && attempts < 1500);

  if (!valid) {
    if (op === '×') {
      a = d1 === 1 ? 2 : (d1 === 2 ? 12 : 112);
      b = d2 === 1 ? 3 : (d2 === 2 ? 13 : 113);
      ans = a * b;
    }
  }

  return{a,b,op,ans};
}

function startGame(){
  resumeAC();
  qNum=0;score=0;answer='';history=[];gameActive=true;
  playStart();
  document.getElementById('scoreArea').style.display='block';
  nextQuestion();
}

function nextQuestion(){
  qNum++;
  if(qNum>10){showResult();return;}
  currentQ=genQ();answer='';
  updateProgress();
  document.getElementById('qLabel').textContent=`もんだい ${qNum} / 10`;
  document.getElementById('scoreVal').textContent=`${score}点`;
  const opMap={'+':'＋','-':'－','×':'×','÷':'÷'};

  document.getElementById('mainArea').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:5px;height:100%;">
      
      <div class="qa-row-wrap">
        <div class="question-card" style="display: flex;">
          <div class="question-text">
            <span>${currentQ.a}</span><span class="op-sym">${opMap[currentQ.op]}</span><span>${currentQ.b}</span>
          </div>
        </div>
        <div class="eq-separator">＝</div>
        <div class="answer-display" id="ansDisp">？</div>
      </div>

      <div class="numpad">
        ${[7,8,9,4,5,6,1,2,3].map(n=>`<button class="num-btn n${n}" onclick="addDigit('${n}')">${n}</button>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
        <button class="num-btn n0" style="border-radius:9px;font-size:20px;font-weight:800;padding:7px 0;border:2px solid #B5D4F4;background:#E6F1FB;color:#0C447C;box-shadow:0 3px 0 #85B7EB;cursor:pointer;" onclick="addDigit('0')">0</button>
        <button class="clear-btn" onclick="clearAns()">⌫ クリア</button>
      </div>
      <button class="answer-btn" onclick="submitAnswer()">こたえる！ ✓</button>
    </div>
  `;
  const ma=document.getElementById('mainArea');
  ma.style.flex='1';ma.style.overflow='hidden';ma.style.justifyContent='';
}

function updateProgress(){
  document.getElementById('progressBar').style.width=`${(qNum-1)*10}%`;
}

function addDigit(d){
  if(!gameActive)return;
  if(answer===''&&d==='0')return;
  if(answer.replace('-','').length>=7)return;
  answer+=d;updateDisp();playClick();
}

function clearAns(){answer='';updateDisp();playClear();}

function updateDisp(){
  const el=document.getElementById('ansDisp');
  if(el){
    el.textContent=answer===''?'？':answer;
    el.className='answer-display';
  }
}

function submitAnswer(){
  if(!gameActive||answer==='')return;
  const userAns=parseInt(answer);
  const el=document.getElementById('ansDisp');
  if(userAns===currentQ.ans){
    score+=10;
    history.push({q:`${currentQ.a} ${currentQ.op} ${currentQ.b}`,ans:currentQ.ans,ok:true});
    if(el)el.className='answer-display correct';
    playCorrect();showPraise();
    document.getElementById('scoreVal').textContent=`${score}点`;
    setTimeout(()=>nextQuestion(),1300);
  } else {
    history.push({q:`${currentQ.a} ${currentQ.op} ${currentQ.b}`,ans:currentQ.ans,user:userAns,ok:false});
    if(el)el.className='answer-display wrong';
    playWrong();
    answer='';
    setTimeout(()=>{const e=document.getElementById('ansDisp');if(e){e.textContent='？';e.className='answer-display';}},400);
    setTimeout(()=>nextQuestion(),1000);
  }
}

function showPraise(){
  const text=praises[Math.floor(Math.random()*praises.length)];
  const colors=['#E24B4A','#378ADD','#1D9E75','#D4537E','#7F77DD','#EF9F27','#D85A30'];
  const el=document.getElementById('praiseText');
  el.textContent=text;
  el.style.color=colors[Math.floor(Math.random()*colors.length)];
  el.className='praise-text show';
  spawnConfetti();
  setTimeout(()=>el.classList.add('hide'),800);
  setTimeout(()=>{el.className='praise-text';},1200);
}

function spawnConfetti(){
  const wrap=document.getElementById('confettiWrap');
  wrap.innerHTML='';
  const colors=['#378ADD','#1D9E75','#D85A30','#D4537E','#7F77DD','#EF9F27','#E24B4A','#fff'];
  for(let i=0;i<50;i++){
    const c=document.createElement('div');
    const col=colors[Math.floor(Math.random()*colors.length)];
    const x=Math.random()*100,size=Math.random()*10+6,dur=Math.random()*700+500;
    c.style.cssText=`position:absolute;left:${x}%;top:-20px;width:${size}px;height:${size}px;background:${col};border-radius:${Math.random()>.5?'50%':'2px'};animation:fall ${dur}ms linear forwards;`;
    wrap.appendChild(c);
  }
  setTimeout(()=>wrap.innerHTML='',1400);
}

function showResult(){
  gameActive=false;
  playFinish(score);
  document.getElementById('progressBar').style.width='100%';
  document.getElementById('scoreVal').textContent=`${score}点`;
  let msg='',emoji='';
  if(score===100){msg='かんぺき！まんてん！おめでとう！';emoji='🏆🎊🌟';showPraise();}
  else if(score>=80){msg='よくできました！すごい！';emoji='⭐🌈';}
  else if(score>=60){msg='がんばりました！もっとれんしゅうしよう！';emoji='👍';}
  else{msg='もう一度チャレンジしてみよう！';emoji='💪';}
  const rows=history.map((h,i)=>`
    <div class="row">
      <span style="color:var(--muted);min-width:18px;">${i+1}.</span>
      <span style="flex:1;">${h.q} ＝ ${h.ans}</span>
      ${h.ok?'<span class="badge-ok">○</span>':`<span class="badge-ng">✕(${h.user})</span>`}
    </div>`).join('');
  document.getElementById('mainArea').innerHTML=`
    <div class="result-card">
      <div class="result-sub">10問のけっか</div>
      <div class="result-score">${score}<span style="font-size:28px">点</span></div>
      <div style="font-size:32px;margin:4px 0;">${emoji}</div>
      <div class="result-msg">${msg}</div>
      <div class="result-list">${rows}</div>
      <button class="start-btn" onclick="startGame()">▶ もう一度！</button>
    </div>
  `;
  document.getElementById('mainArea').style.flex='1';
  document.getElementById('mainArea').style.overflow='auto';
  document.getElementById('mainArea').style.justifyContent='center';
}

// ====== HISSAN CANVAS ======
const canvas=document.getElementById('hissanCanvas');
const ctx=canvas.getContext('2d');
let drawing=false,penColor='#1a2d45',penSize=3,erasing=false,lastX=0,lastY=0;

function resizeCanvas(){
  const wrap=canvas.parentElement,dpr=window.devicePixelRatio||1;
  const w=wrap.clientWidth,h=wrap.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  drawGrid(w,h);
}

function drawGrid(w,h){
  ctx.save();ctx.strokeStyle='#b8d8f0';ctx.lineWidth=0.5;
  const step=32;
  for(let x=0;x<=w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<=h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.restore();
}

function getPos(e){
  const r=canvas.getBoundingClientRect(),src=e.touches?e.touches[0]:e;
  return[src.clientX-r.left,src.clientY-r.top];
}
function startDraw(e){e.preventDefault();drawing=true;[lastX,lastY]=getPos(e);}
function doDraw(e){
  e.preventDefault();if(!drawing)return;
  const[x,y]=getPos(e);
  ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);
  if(erasing){ctx.globalCompositeOperation='source-over';ctx.strokeStyle='#fffef5';ctx.lineWidth=penSize*5;}
  else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=penColor;ctx.lineWidth=penSize;}
  ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  [lastX,lastY]=[x,y];
}
function endDraw(){drawing=false;}

canvas.addEventListener('mousedown',startDraw);
canvas.addEventListener('mousemove',doDraw);
canvas.addEventListener('mouseup',endDraw);
canvas.addEventListener('mouseleave',endDraw);
canvas.addEventListener('touchstart',startDraw,{passive:false});
canvas.addEventListener('touchmove',doDraw,{passive:false});
canvas.addEventListener('touchend',endDraw);

function clearCanvas(){
  const w=canvas.width/(window.devicePixelRatio||1),h=canvas.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,canvas.width,canvas.height);drawGrid(w,h);playClear();
}
function setColor(el){
  document.querySelectorAll('.color-pick').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');penColor=el.dataset.color;erasing=false;
  document.getElementById('eraserBtn').classList.remove('sel');playClick();
}
function setSize(el){
  document.querySelectorAll('.size-btn').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');penSize=parseInt(el.dataset.size);playClick();
}
function toggleEraser(){
  erasing=!erasing;
  document.getElementById('eraserBtn').classList.toggle('sel',erasing);playClick();
}

// 起動時の初期化チェック
updateDetailSettingsState();

window.addEventListener('resize',resizeCanvas);
resizeCanvas();
</script>
