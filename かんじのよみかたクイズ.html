<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かんじよみかたクイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Kosugi Maru', sans-serif;
    background: #f0f6ff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 1.5rem 1rem 3rem;
  }

  #app {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .screen { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .screen.hidden { display: none; }

  /* ===== START ===== */
  .app-title {
    font-size: 2rem;
    font-weight: 700;
    color: #1a56a4;
    letter-spacing: 2px;
    margin-top: 0.5rem;
    text-align: center;
  }
  .app-sub { font-size: 1rem; color: #555; text-align: center; }

  .grade-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }
  .grade-btn {
    padding: 1rem 0;
    font-size: 1.1rem;
    font-weight: 700;
    border: 3px solid transparent;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .grade-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
  .grade-btn.g1 { background: #fff0f0; color: #c0392b; border-color: #f0a0a0; }
  .grade-btn.g2 { background: #fff5e6; color: #d06000; border-color: #f0c080; }
  .grade-btn.g3 { background: #fffde6; color: #b08000; border-color: #e0d060; }
  .grade-btn.g4 { background: #f0fff0; color: #1a7a30; border-color: #80d080; }
  .grade-btn.g5 { background: #e8f0ff; color: #1a3fa0; border-color: #80a0f0; }
  .grade-btn.g6 { background: #f5e8ff; color: #6a1ab0; border-color: #c090f0; }
  .grade-btn.selected {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    border-width: 4px;
    filter: brightness(1.05);
  }

  .start-btn {
    margin-top: 0.5rem;
    padding: 0.85rem 3rem;
    font-size: 1.3rem;
    font-weight: 700;
    background: linear-gradient(135deg, #2575fc, #1a9e6e);
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(37,117,252,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,117,252,0.4); }
  .start-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

  /* ===== QUIZ ===== */
  .q-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
    color: #666;
  }
  .q-score-live { font-size: 1rem; font-weight: 700; color: #1a56a4; }

  .q-progress-bar { width: 100%; height: 10px; background: #dce8ff; border-radius: 99px; overflow: hidden; }
  .q-progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #2575fc, #1dd1a1);
    transition: width 0.4s;
  }

  .kanji-card {
    width: 100%;
    background: #fff;
    border: 3px solid #b0ccff;
    border-radius: 20px;
    padding: 1.5rem 1rem;
    text-align: center;
    box-shadow: 0 3px 12px rgba(37,117,252,0.08);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 160px;
  }
  .kanji-label { font-size: 0.85rem; color: #888; margin-bottom: 0.4rem; }
  .kanji-display { color: #1a3a7a; line-height: 1.15; }
  .kanji-context { font-size: 0.95rem; color: #555; margin-top: 0.5rem; }

  .choices { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1.6rem;
    font-weight: 700;
    background: #fff;
    color: #222;
    border: 2.5px solid #ccc;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s, border-color 0.1s, background 0.1s;
    text-align: center;
  }
  .choice-btn:hover:not(:disabled) {
    transform: scale(1.04);
    border-color: #2575fc;
    background: #f0f6ff;
  }
  .choice-btn.correct { background: #d4edda; border-color: #28a745; color: #145a23; }
  .choice-btn.wrong   { background: #f8d7da; border-color: #dc3545; color: #721c24; }
  .choice-btn:disabled { cursor: default; }

  .feedback { font-size: 1.4rem; font-weight: 700; min-height: 2rem; text-align: center; }
  .feedback.ok { color: #1a7a30; }
  .feedback.ng { color: #c0392b; }

  /* ===== RESULT ===== */
  .result-card {
    width: 100%;
    background: #fff;
    border: 3px solid #b0ccff;
    border-radius: 24px;
    padding: 2rem 1.5rem;
    text-align: center;
    box-shadow: 0 3px 12px rgba(37,117,252,0.08);
  }
  .result-emoji  { font-size: 3.5rem; }
  .result-title  { font-size: 1.6rem; font-weight: 700; color: #1a3a7a; margin: 0.4rem 0; }
  .result-score  { font-size: 4rem; font-weight: 700; color: #2575fc; line-height: 1.1; }
  .result-sub    { font-size: 1rem; color: #666; margin-bottom: 1rem; }
  .stars         { font-size: 2rem; letter-spacing: 4px; }

  .result-log  { display: flex; flex-direction: column; gap: 6px; text-align: left; margin: 1rem 0; }
  .log-item    { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; padding: 5px 8px; border-radius: 8px; }
  .log-item.ok { background: #d4edda; color: #145a23; }
  .log-item.ng { background: #f8d7da; color: #721c24; }
  .log-mark    { font-size: 1.1rem; flex-shrink: 0; }

  .retry-btn {
    padding: 0.85rem 2.5rem;
    font-size: 1.2rem;
    font-weight: 700;
    background: #2575fc;   /* 通常時の背景を青に */
    color: #fff;           /* 通常時の文字を白に */
    border: 3px solid #2575fc;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  /* ポインタを合わせたときに白ベース（背景白・文字青）にする */
  .retry-btn:hover { background: #fff; color: #2575fc; }



  .back-btn {
    padding: 0.6rem 1.5rem;
    font-size: 1rem;
    background: #1a9e6e;   /* 通常時の背景を緑に */
    color: #fff;           /* 通常時の文字を白に */
    border: 2px solid #1a9e6e;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  /* ポインタを合わせたときに白ベース（背景白・文字緑）にする */
  .back-btn:hover { background: #fff; color: #1a9e6e; }

  @keyframes pop {
    0%   { transform: scale(0.6); opacity: 0; }
    70%  { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop { animation: pop 0.35s ease forwards; }

  /* ===== 正解オーバーレイ ===== */
  #correct-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;
    justify-content: center;
    align-items: center;
  }
  #correct-overlay.show { display: flex; }

  /* 半透明の緑フラッシュ背景 */
  #correct-overlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(40, 200, 100, 0.18);
    animation: flash-bg 0.6s ease forwards;
  }
  @keyframes flash-bg {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* 中央の大きな⭕ */
  .overlay-circle {
    position: relative;
    width: 55vmin;
    height: 55vmin;
    border-radius: 50%;
    border: 10vmin solid rgba(220, 50, 50, 0.6);
    background: transparent;
    animation: circle-pop 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes circle-pop {
    0%   { transform: scale(0.2) rotate(-20deg); opacity: 0; }
    40%  { transform: scale(1.15) rotate(4deg);  opacity: 1; }
    65%  { transform: scale(0.95) rotate(-2deg); opacity: 1; }
    100% { transform: scale(1)    rotate(0deg);  opacity: 0; }
  }

  /* 「せいかい！」テキスト */
  .overlay-text {
    position: absolute;
    bottom: -1.8rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.4rem;
    font-weight: 700;
    color: #c0392b;
    white-space: nowrap;
    letter-spacing: 2px;
    animation: text-fade 0.9s ease forwards;
  }
  @keyframes text-fade {
    0%,40% { opacity: 0; }
    60%     { opacity: 1; }
    100%    { opacity: 0; }
  }
</style>
</head>

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(frequency, type, duration, volume = 0.4, delay = 0) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(frequency, ctx.currentTime + delay);
  gain.gain.setValueAtTime(volume, ctx.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration);

}

// 選択音（学年ボタン）: 軽くポンッ
function playSelectSound() {
  playTone(660, 'sine', 0.12, 0.3);
}

// 正解音: 明るいファンファーレ
function playCorrectSound() {
  playTone(523, 'sine', 0.12, 0.35, 0.00);
  playTone(659, 'sine', 0.12, 0.35, 0.10);
  playTone(784, 'sine', 0.25, 0.35, 0.20);
}

// 不正解音: 低くブー
function playWrongSound() {
  playTone(440, 'sine', 0.15, 0.3, 0.00); // 220→440に変更
  playTone(330, 'sine', 0.25, 0.3, 0.12); // 180→330に変更
}

// 終了音（結果画面）: 達成感のあるメロディ
function playFinishSound(pct) {
  if (pct >= 1.0) {
    // パーフェクト：高らかなファンファーレ
    [[523,0],[659,0.1],[784,0.2],[1047,0.35]].forEach(([f,d]) => playTone(f,'sine',0.35,0.4,d));
  } else if (pct >= 0.5) {
    // 合格：明るく
    playTone(523, 'sine', 0.2, 0.35, 0.0);
    playTone(659, 'sine', 0.3, 0.35, 0.15);
  } else {
    // 低得点：励ます感じの下降音
    playTone(330, 'sine', 0.15, 0.3, 0.00);
    playTone(294, 'sine', 0.15, 0.3, 0.18);
    playTone(262, 'sine', 0.30, 0.3, 0.36);
  }
}

// はじめる・もういちど: 元気よくスタート
function playStartSound() {
  playTone(392, 'sine', 0.1, 0.35, 0.00);
  playTone(523, 'sine', 0.2, 0.35, 0.10);
}

// がくねんせんたくにもどる: 戻る感じの下降音
function playBackSound() {
  playTone(523, 'sine', 0.1, 0.3, 0.00);
  playTone(392, 'sine', 0.2, 0.3, 0.10);
}

let selectedGrade = null;
let questions = [], current = 0, score = 0, log = [];
const PER_Q = 10, POINTS = 10;

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function buildQuestions(grade) {
  return shuffle(DATA[grade]).slice(0, PER_Q).map(d => ({
    word: d.word,
    yomi: d.yomi,
    choices: shuffle([d.yomi, ...d.decoy.slice(0, 2)]),
  }));
}

function showScreen(id) {
  ['screen-start', 'screen-quiz', 'screen-result'].forEach(s =>
    document.getElementById(s).classList.toggle('hidden', s !== id)
  );
}

document.querySelectorAll('.grade-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedGrade = parseInt(btn.dataset.grade);
    document.getElementById('start-btn').disabled = false;
    playSelectSound();
  });
});

document.getElementById('start-btn').addEventListener('click', () => { playStartSound(); startQuiz(); });
document.getElementById('retry-btn').addEventListener('click', () => { playStartSound(); startQuiz(); });
document.getElementById('back-btn').addEventListener('click', () => { playBackSound(); showScreen('screen-start'); });

function startQuiz() {
  questions = buildQuestions(selectedGrade);
  current = 0; score = 0; log = [];
  showScreen('screen-quiz');
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  document.getElementById('q-num').textContent = `${current + 1} / ${PER_Q}`;
  document.getElementById('q-score-live').textContent = `${score}点`;
  document.getElementById('q-progress').style.width = `${(current / PER_Q) * 100}%`;

  const disp = document.getElementById('kanji-display');
  disp.textContent = q.word;
  const len = q.word.length;
  disp.style.fontSize = len >= 5 ? '2rem' : len >= 4 ? '2.4rem' : len >= 3 ? '3rem' : len >= 2 ? '3.5rem' : '4rem';

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.addEventListener('click', () => answer(c, q));
    choicesEl.appendChild(btn);
  });
}

function answer(chosen, q) {
  const ok = chosen === q.yomi;
  if (ok) score += POINTS;
  log.push({ word: q.word, yomi: q.yomi, chosen, ok });

  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === q.yomi) btn.classList.add('correct');
    else if (btn.textContent === chosen && !ok) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if (ok) {
    fb.textContent = '';
    fb.className = 'feedback ok';
    playCorrectSound();
    // 画面全体に⭕オーバーレイを表示
    const overlay = document.getElementById('correct-overlay');
    overlay.classList.add('show');
    setTimeout(() => overlay.classList.remove('show'), 1000);
  } else {
    fb.textContent = `❌ こたえは「${q.yomi}」だよ`;
    fb.className = 'feedback ng';
    playWrongSound();
  }

  setTimeout(() => {
    current++;
    if (current < PER_Q) showQuestion();
    else showResult();
  }, 1500);
}

function showResult() {
  showScreen('screen-result');
  const pct = score / (PER_Q * POINTS);
  playFinishSound(pct);
  document.getElementById('result-score').textContent = `${score}点`;
  document.getElementById('result-sub').textContent =
    `${PER_Q}問中${log.filter(l => l.ok).length}問 せいかい！`;

  let emoji, title, stars;
  if      (pct >= 1.0) { emoji = '🎉'; title = 'かんぺき！すごいね！';  stars = '⭐⭐⭐'; }
  else if (pct >= 0.8) { emoji = '😄'; title = 'よくできました！';      stars = '⭐⭐'; }
  else if (pct >= 0.5) { emoji = '🙂'; title = 'またやってみよう！';  stars = '⭐'; }
  else                 { emoji = '🙂'; title = 'またやってみよう！';  stars = ''; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-stars').textContent = stars;

  const logEl = document.getElementById('result-log');
  logEl.innerHTML = '';
  log.forEach(l => {
    const div = document.createElement('div');
    div.className = `log-item ${l.ok ? 'ok' : 'ng'}`;
    div.innerHTML =
      `<span class="log-mark">${l.ok ? '⭕' : '❌'}</span>` +
      `<strong>${l.word}</strong>　→　${l.yomi}` +
      (!l.ok ? `　（あなた：${l.chosen}）` : '');
    logEl.appendChild(div);
  });
}
</script>
</body>
</html>
